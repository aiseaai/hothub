name: Fetch Hot Boards

on:
  schedule:
    # 每小时整点后 17 分钟运行（UTC），避开整点高峰
    - cron: "17 * * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund || true

      - name: Fetch hot boards
        run: npm run fetch

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotboards.json
          if git diff --cached --quiet; then
            echo "No data changes, skip commit"
          else
            git commit -m "chore: 更新热榜数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
